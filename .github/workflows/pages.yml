name: Pages

# Сайт https://zazza.github.io/partscaster/ — site/index.html и примеры «было/стало» окна знакомства
# (собирает tools/site-build.sh). Публикуется из develop и main при изменении страницы или клипов.
# Один раз в настройках репозитория: Settings → Pages → Source: GitHub Actions; для публикации из develop —
# Settings → Environments → github-pages → разрешить ветку develop.
on:
  push:
    branches: [develop, main]
    paths:
      - .github/workflows/pages.yml
      - site/**
      - tools/site-build.sh
      - frontend/src/welcomeClips.json
      - frontend/src/assets/logo.png
      - internal/welcome/clips/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Сборка сайта
        run: tools/site-build.sh _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
