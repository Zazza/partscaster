name: Release

# Релиз по тегу v*: приложение + partscaster-mcp + архив воркера под Linux/Windows/macOS,
# всё выкладывается в GitHub Release этого тега. Тег ставит и пушит человек.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # действия закреплены по коммиту (у job право contents: write); тег — в комментарии
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # git describe нужна история и теги
          persist-credentials: false  # токен не остаётся в .git/config на время сборки (npm-зависимости)
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux deps (GTK/WebKit для Wails)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Wails CLI (версия — как в go.mod)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
      - name: CUDA Toolkit (Windows — сборка yue2.cpp, ~10 мин)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install -y cuda --version=12.8.1.1.9 # как контейнер Linux-сборки (12.8); VS C++ на раннере есть
      - name: Пакет
        # release.sh сам собирает yue2.cpp готовой программой: на Linux — в контейнере CUDA 12.8, на Windows —
        # локально с CUDA из шага выше. Без сборки пакет Windows не собирается (partscaster-worker.exe не умеет
        # собирать yue2.cpp сам); архив воркера Linux собирается с предупреждением — install.sh соберёт программу
        run: |
          # Linux: Wails под webkit2gtk-4.1 (на ubuntu-24.04 нет 4.0, без тега cgo ищет 4.0)
          if [[ "$RUNNER_OS" == "Linux" ]]; then export GOFLAGS="-tags=webkit2_41"; fi
          WAILS="$(go env GOPATH)/bin/wails" tools/release.sh "${GITHUB_REF_NAME}"
      - name: Выложить в релиз
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # отдельный архив воркера — из Linux-сборки (для GPU-машины на Linux: в нём программа yue2.cpp под Linux);
          # пакеты Windows и macOS несут свой архив воркера внутри пакета
          files: |
            dist/partscaster-*.tar.gz
            dist/partscaster-*.zip
            ${{ runner.os == 'Linux' && 'dist/worker-*.tar.gz' || '' }}
